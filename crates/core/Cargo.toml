[package]
name = "sambung-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Inti Sambung: capture, video, jaringan, pairing, transfer. Tanpa dependensi UI."

[dependencies]
anyhow = "1.0.104"
hmac = "0.12"
openh264 = "0.9"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls", "ring"] }
rand = "0.8"
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
spake2 = "0.4"
subtle = "2"
thiserror = "2.0.21"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs", "io-util"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-foundation = "0.3"
objc2-screen-capture-kit = "0.3"
